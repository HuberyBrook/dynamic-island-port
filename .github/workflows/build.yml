name: Build Dynamic Island Port

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Download Xposed API stubs
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/api-82.jar \
            "https://github.com/rovo89/XposedBridge/releases/download/v89/api-82.jar"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandPort
          path: app/build/outputs/apk/release/app-release-unsigned.apk
